{% extends 'customer/base.html' %}

{% block title %}{{ code }} - {{ title }}{% endblock %}

{% block content %}
<div class="container py-5 my-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6 text-center">
            <!-- Premium Error Card -->
            <div class="card border-0 shadow-lg p-5 fade-in-up" style="border-radius: 24px; background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border: 1px solid rgba(255, 179, 0, 0.15);">
                
                <!-- Custom Dynamic SVGs for different HTTP Codes -->
                <div class="mb-4 d-flex justify-content-center">
                    {% if code == 404 %}
                    <!-- Beautiful 404 Broken/Bitten Chocolate Bar SVG -->
                    <svg width="180" height="180" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg" class="img-fluid" style="filter: drop-shadow(0px 8px 16px rgba(62, 39, 35, 0.15));">
                        <!-- Chocolate Base -->
                        <path d="M40 60C40 48.9543 48.9543 40 60 40H110C110 40 108 55 125 55C140 55 140 70 155 70C155 70 160 85 145 95C130 105 145 120 160 120V160C160 171.046 151.046 180 140 180H60C48.9543 180 40 171.046 40 160V60Z" fill="#3E2723" />
                        <!-- Bitten Marks Detail (Shadows) -->
                        <path d="M110 40C110 40 108 55 125 55C140 55 140 70 155 70C155 70 160 85 145 95C130 105 145 120 160 120C160 105 165 95 150 85C135 75 145 60 130 45C118 33 110 40 110 40Z" fill="#2D1A17" opacity="0.3"/>
                        <!-- Chocolate Grid Segments -->
                        <!-- Row 1 -->
                        <rect x="55" y="60" width="30" height="30" rx="6" fill="#5D4037" />
                        <rect x="95" y="60" width="30" height="30" rx="6" fill="#5D4037" />
                        <!-- Row 2 -->
                        <rect x="55" y="100" width="30" height="30" rx="6" fill="#5D4037" />
                        <rect x="95" y="100" width="30" height="30" rx="6" fill="#5D4037" />
                        <rect x="135" y="105" width="15" height="25" rx="4" fill="#5D4037" />
                        <!-- Row 3 -->
                        <rect x="55" y="140" width="30" height="30" rx="6" fill="#5D4037" />
                        <rect x="95" y="140" width="30" height="30" rx="6" fill="#5D4037" />
                        <rect x="135" y="140" width="15" height="30" rx="4" fill="#5D4037" />
                        <!-- Wrapping Foil (Torn) -->
                        <path d="M40 110L60 105L85 115L105 110L135 118L148 112L160 120V160C160 171.046 151.046 180 140 180H60C48.9543 180 40 171.046 40 160V110Z" fill="#E0E0E0" opacity="0.9" />
                        <path d="M40 120L58 115L82 125L108 118L132 125L145 118L160 125V160C160 171.046 151.046 180 140 180H60C48.9543 180 40 171.046 40 160V120Z" fill="#BDBDBD" />
                        <!-- Logo badge on foil -->
                        <circle cx="100" cy="150" r="18" fill="#FFB300" />
                        <path d="M96 146C96 146 100 144 104 148C108 152 104 156 104 156" stroke="#3E2723" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                    {% elif code == 500 %}
                    <!-- Beautiful 500 Melting/Baking Pot SVG -->
                    <svg width="180" height="180" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg" class="img-fluid" style="filter: drop-shadow(0px 8px 16px rgba(216, 67, 21, 0.15));">
                        <!-- Steam lines -->
                        <path d="M70 40C72 30 78 30 80 20" stroke="#FFB300" stroke-width="3" stroke-linecap="round" opacity="0.7">
                            <animate attributeName="stroke-dashoffset" values="0;10" dur="2s" repeatCount="indefinite" />
                        </path>
                        <path d="M100 35C103 22 110 22 113 10" stroke="#FFB300" stroke-width="3" stroke-linecap="round">
                            <animate attributeName="stroke-dashoffset" values="0;10" dur="1.8s" repeatCount="indefinite" />
                        </path>
                        <path d="M130 40C132 30 138 30 140 20" stroke="#FFB300" stroke-width="3" stroke-linecap="round" opacity="0.7">
                            <animate attributeName="stroke-dashoffset" values="0;10" dur="2.2s" repeatCount="indefinite" />
                        </path>
                        <!-- Melting Pot -->
                        <path d="M50 70H150L140 150C140 161.046 131.046 170 120 170H80C68.9543 170 60 161.046 60 150L50 70Z" fill="#3E2723" />
                        <!-- Pot Rim -->
                        <rect x="42" y="62" width="116" height="10" rx="5" fill="#2D1A17" />
                        <!-- Melting Chocolate Drips -->
                        <path d="M42 72C42 72 55 85 65 85C75 85 80 75 90 75C100 75 105 90 115 90C125 90 130 78 140 78C150 78 158 72 158 72V85C158 85 150 95 140 95C130 95 125 85 115 85C105 85 100 100 90 100C80 100 75 92 65 92C55 92 42 85 42 85V72Z" fill="#D84315" />
                        <!-- Whisk handle/paddle sticking out -->
                        <rect x="110" y="45" width="8" height="40" rx="3" transform="rotate(25 110 45)" fill="#BDBDBD" />
                        <rect x="105" y="30" width="18" height="18" rx="4" transform="rotate(25 105 30)" fill="#FFB300" />
                    </svg>
                    {% else %}
                    <!-- Generic Premium Error/Caution SVG -->
                    <svg width="180" height="180" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg" class="img-fluid" style="filter: drop-shadow(0px 8px 16px rgba(255, 179, 0, 0.2));">
                        <circle cx="100" cy="100" r="80" fill="#FFF8E1" stroke="#FFB300" stroke-width="4" />
                        <!-- Exclamation Point -->
                        <rect x="93" y="55" width="14" height="55" rx="7" fill="#3E2723" />
                        <circle cx="100" cy="135" r="9" fill="#3E2723" />
                        <!-- Subtle background decorative stars -->
                        <path d="M45 55L48 48L55 45L48 42L45 35L42 42L35 45L42 48L45 55Z" fill="#FFB300" opacity="0.6" />
                        <path d="M155 145L157 140L162 138L157 136L155 131L153 136L148 138L153 140L155 145Z" fill="#D84315" opacity="0.6" />
                    </svg>
                    {% endif %}
                </div>

                <!-- Error Code Badge -->
                <span class="badge rounded-pill px-3 py-2 fs-6 mb-3 align-self-center" style="background-color: rgba(216, 67, 21, 0.1); color: #d84315; font-weight: 700; letter-spacing: 1px;">
                    ERROR {{ code }}
                </span>

                <!-- Title & Message -->
                <h1 class="fw-bold mb-3" style="color: #3e2723; font-family: 'Playfair Display', Georgia, serif; font-size: 2.2rem;">
                    {{ title }}
                </h1>
                
                <p class="text-muted fs-5 mb-5 px-3" style="font-family: 'Inter', sans-serif; line-height: 1.6;">
                    {{ description }}
                </p>

                <!-- Call to Action -->
                <div class="d-grid gap-2 d-sm-flex justify-content-sm-center">
                    <a href="{{ action_url }}" class="btn btn-premium px-5 py-3 fs-6 shadow-sm rounded-pill">
                        {{ action_text }}
                    </a>
                </div>
            </div>
            
            <!-- Quick links footer under card -->
            <div class="mt-4 opacity-75">
                <a href="{{ url_for('customer.collections') }}" class="text-decoration-none mx-2 text-dark fw-medium hover-gold">View Collections</a>
                <span class="text-muted">•</span>
                <a href="/" class="text-decoration-none mx-2 text-dark fw-medium hover-gold">Back to Home</a>
            </div>
        </div>
    </div>
</div>

<style>
    /* Styling hover effects */
    .hover-gold:hover {
        color: #ffb300 !important;
        text-decoration: underline !important;
    }
</style>
{% endblock %}
