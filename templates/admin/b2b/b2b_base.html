<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}B2B Operations Desk{% endblock %} - Sweet Scribbles</title>
    <!-- Favicon & Touch Icons -->
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='favicon-32x32.png') }}?v=2">
    <link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', filename='favicon-16x16.png') }}?v=2">
    <link rel="shortcut icon" href="{{ url_for('static', filename='favicon.ico') }}?v=2">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f6f8fa;
            color: #24292f;
        }
        .b2b-navbar {
            background: #1e130f !important;
            border-bottom: 2px solid #c79442;
        }
        .nav-link-b2b {
            color: rgba(255, 255, 255, 0.8) !important;
            font-weight: 500;
            padding: 0.5rem 0.9rem !important;
            border-radius: 6px;
            transition: all 0.2s ease;
            font-size: 0.92rem;
        }
        .nav-link-b2b:hover {
            color: #ffca64 !important;
            background: rgba(255, 255, 255, 0.08);
        }
        .nav-link-b2b.active {
            color: #ffca64 !important;
            background: rgba(199, 148, 66, 0.25);
            font-weight: 700;
        }
        .badge-gold {
            background: #c79442;
            color: #fff;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        .btn-gold {
            background: #c79442;
            border-color: #c79442;
            color: white;
            font-weight: 600;
        }
        .btn-gold:hover {
            background: #b58232;
            border-color: #b58232;
            color: white;
        }
    </style>
</head>
<body>

    <!-- Dedicated B2B Admin Header Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark b2b-navbar sticky-top shadow-sm py-2">
        <div class="container-fluid px-4">
            <!-- Brand & Badge -->
            <a class="navbar-brand d-flex align-items-center gap-2" href="{{ url_for('b2b_admin.dashboard') }}">
                <img src="{{ url_for('static', filename='images/official_logo_white.png') }}" alt="Sweet Scribbles" style="height: 28px; max-width: 140px; object-fit: contain;">
                <span class="badge badge-gold px-2.5 py-1 rounded-pill" style="font-size: 0.72rem;">B2B Corporate Desk</span>
            </a>
            
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#b2bAdminNav" aria-controls="b2bAdminNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="collapse navbar-collapse" id="b2bAdminNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-3 gap-1">
                    <li class="nav-item">
                        <a class="nav-link nav-link-b2b {% if request.endpoint == 'b2b_admin.dashboard' %}active{% endif %}" href="{{ url_for('b2b_admin.dashboard') }}">
                            <i class="bi bi-kanban me-1"></i>Pipeline Board
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link nav-link-b2b {% if request.endpoint == 'b2b_admin.orders' %}active{% endif %}" href="{{ url_for('b2b_admin.orders') }}">
                            <i class="bi bi-box-seam me-1"></i>B2B Orders
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link nav-link-b2b {% if request.endpoint in ['b2b_admin.clients', 'b2b_admin.client_detail'] %}active{% endif %}" href="{{ url_for('b2b_admin.clients') }}">
                            <i class="bi bi-building me-1"></i>Corporate Clients
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link nav-link-b2b {% if request.endpoint == 'b2b_admin.products' %}active{% endif %}" href="{{ url_for('b2b_admin.products') }}">
                            <i class="bi bi-gift me-1"></i>B2B Products & Boxes
                        </a>
                    </li>
                </ul>
                
                <ul class="navbar-nav ms-auto align-items-center gap-2">
                    <li class="nav-item">
                        <a class="btn btn-sm btn-outline-light d-flex align-items-center gap-1" href="{{ url_for('admin.dashboard') }}" title="Switch to Retail Store Management">
                            <i class="bi bi-shop"></i>
                            <span>Retail Admin</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="btn btn-sm btn-warning fw-bold d-flex align-items-center gap-1" href="{{ url_for('b2b.index') }}" target="_blank">
                            <i class="bi bi-box-arrow-up-right"></i>
                            <span>Live B2B Site</span>
                        </a>
                    </li>
                    <li class="nav-item ms-2">
                        <a class="nav-link text-danger p-0 small fw-bold" href="{{ url_for('auth.logout') }}">
                            <i class="bi bi-power me-1"></i>Logout
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="container-fluid px-4 py-4">
        {% block content %}{% endblock %}
    </div>

    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
